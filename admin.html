<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão | Seleção 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body class="dashboard-body">
<div id="dashboardView">
  <main class="container">
    <div class="step">SELEÇÃO 2027</div><h2>Gestão</h2>
    <div class="stats">
      <div class="stat"><strong id="statTotal">0</strong><span>Inscrições</span></div>
      <div class="stat"><strong id="statNextExam">—</strong><span>Próxima prova</span></div>
      <div class="stat"><strong id="statToday">0</strong><span>Inscrições hoje</span></div>
      <div class="stat"><strong id="statSeries">0</strong><span>Séries com inscritos</span></div>
    </div>
    <div class="cards">
      <div class="panel"><h3>Próxima prova</h3><div id="nextExamCard"></div></div>
      <div class="panel"><h3>Próximas datas</h3><div id="upcomingExamDates"></div></div>
    </div>
  </main>
</div>
<script type="module" src="./admin.js"></script>
</body>
</html>
